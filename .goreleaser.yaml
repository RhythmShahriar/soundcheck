# Release config. The archive and checksum names are a contract with
# rhythm/kit/update and the install script: <binary>_<os>_<arch>.tar.gz
# (.zip on Windows) plus checksums.txt.
version: 2
project_name: rhythm-soundcheck

# The release must carry valid Chrome for Testing pins: hash the committed
# version's archives again (about 1 GB of downloads) and stop if they
# differ or nothing is pinned. It never moves to a newer Stable, so a tag
# pushed after Google's weekly Stable change still releases. Bump the
# pins with `go generate ./browser` and commit browser/cft_pins.go before
# tagging.
before:
  hooks:
    - scripts/verify-pins.sh

builds:
  - main: ./cmd/rhythm-soundcheck
    binary: rhythm-soundcheck
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # The binary embeds axe-core (MPL-2.0), so its license and the notices
    # of what it bundles ship beside it; the README names its source.
    files:
      - README.md
      - LICENSE*
      - src: checks/a11y/vendor/LICENSE*
        dst: THIRD_PARTY/axe-core
        strip_parent: true

# An SPDX SBOM per archive, written by syft (the release workflow puts it
# on PATH) and attested with the archives. syft finds the Go modules in
# the binary but not the axe-core it embeds as JavaScript, so that one
# is the committed CycloneDX SBOM sboms/axe-core.cdx.json (kept in step by
# scripts/update-axe.sh). It goes onto the release and into checksums.txt,
# which the release signs and attests.
sboms:
  - artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.json"]
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: sboms/axe-core.cdx.json

# A tag like v0.4.0-rc1 is published as a prerelease, which GitHub never
# reports as "latest", so rhythm update and the installers don't offer it.
release:
  prerelease: auto
  extra_files:
    - glob: sboms/axe-core.cdx.json

# Keyless Sigstore signature over checksums.txt. The release workflow is
# called at master, the only identity rhythm update accepts. Verify with
# scripts/verify-release.sh, which runs:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity https://github.com/RhythmShahriar/.github/.github/workflows/release-go.yml@refs/heads/master \
#     --certificate-github-workflow-repository RhythmShahriar/soundcheck checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude: ['^(docs|test|ci|chore|style)(\(.+\))?!?:']
