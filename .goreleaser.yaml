# Release config. The archive and checksum names are a contract with
# rhythm/kit/update and the install script: <binary>_<os>_<arch>.tar.gz
# (.zip on Windows) plus checksums.txt.
version: 2
project_name: rhythm-soundcheck

# The release must carry current Chrome for Testing pins: regenerate them
# (this downloads and hashes every platform's archive) and stop if they
# differ from what's committed. Run `go generate ./browser` and commit
# browser/cft_pins.go before tagging.
before:
  hooks:
    - go run ./browser/internal/pingen -o browser/cft_pins.go
    - git diff --exit-code browser/cft_pins.go

builds:
  - main: ./cmd/rhythm-soundcheck
    binary: rhythm-soundcheck
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE*]

checksum:
  name_template: checksums.txt

# A tag like v0.4.0-rc1 is published as a prerelease, which GitHub never
# reports as "latest", so rhythm update and the installers don't offer it.
release:
  prerelease: auto

# Keyless Sigstore signature over checksums.txt. The release workflow is
# pinned by commit, so the identity is matched up to the ref. Verify with
# scripts/verify-release.sh, which runs:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/RhythmShahriar/\.github/\.github/workflows/release-go\.yml@' \
#     --certificate-github-workflow-repository RhythmShahriar/soundcheck checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude: ['^(docs|test|ci|chore|style)(\(.+\))?!?:']
