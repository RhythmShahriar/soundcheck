# Runs the Action itself against a small local site, checks that a
# release with a changed checksums.txt is refused and lints the
# workflows. Everything is pinned by commit.
name: action-test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Serve a test site on 127.0.0.1
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          page() { printf '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>%s</title></head><body><h1>%s</h1><a href="/">Home</a> <a href="/about.html">About</a></body></html>\n' "$1" "$1"; }
          page Home > "$site/index.html"
          page About > "$site/about.html"
          : > "$site/favicon.ico"
          nohup python3 -m http.server 20340 --bind 127.0.0.1 --directory "$site" > "$RUNNER_TEMP/http.log" 2>&1 &
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:20340/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/http.log"; exit 1

      - name: Check once
        id: run
        uses: ./
        with:
          url: http://127.0.0.1:20340/
          fail-on: none
          upload: "false"
      - name: Snapshot
        uses: ./
        with:
          url: http://127.0.0.1:20340/
          mode: snapshot
          fail-on: none
          upload: "false"
      - name: Compare with the snapshot
        id: compare
        uses: ./
        with:
          url: http://127.0.0.1:20340/
          mode: compare
          upload: "false"

      - name: Check the outputs
        env:
          RUN_CODE: ${{ steps.run.outputs.exit-code }}
          RUN_REPORT: ${{ steps.run.outputs.report }}
          COMPARE_CODE: ${{ steps.compare.outputs.exit-code }}
        run: |
          set -x
          case "$RUN_CODE" in 0|1) ;; *) exit 1 ;; esac
          test -s "$RUN_REPORT"
          test "$COMPARE_CODE" = 0

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test verify-release.sh offline
        run: scripts/verify-release-test.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the latest release
        run: |
          mkdir -p "$RUNNER_TEMP/release" && cd "$RUNNER_TEMP/release"
          base=https://github.com/RhythmShahriar/soundcheck/releases/latest/download
          for f in rhythm-soundcheck_linux_amd64.tar.gz checksums.txt checksums.txt.sigstore.json; do
            curl -fsSLO "$base/$f"
          done
      - name: The real release verifies
        working-directory: ${{ runner.temp }}/release
        run: |
          "$GITHUB_WORKSPACE/scripts/verify-release.sh" rhythm-soundcheck_linux_amd64.tar.gz
      - name: A changed checksums.txt is refused
        working-directory: ${{ runner.temp }}/release
        run: |
          cp checksums.txt checksums.orig
          sum=$(sha256sum rhythm-soundcheck_linux_amd64.tar.gz | cut -d' ' -f1)
          # Swap in a line that matches the archive, as someone replacing
          # both files in a release would.
          grep -v ' rhythm-soundcheck_linux_amd64.tar.gz$' checksums.orig > checksums.txt
          echo "$sum  rhythm-soundcheck_linux_amd64.tar.gz" >> checksums.txt
          if "$GITHUB_WORKSPACE/scripts/verify-release.sh" rhythm-soundcheck_linux_amd64.tar.gz; then
            echo "::error::verify-release.sh accepted a changed checksums.txt"
            exit 1
          fi
      - name: A changed archive is refused
        working-directory: ${{ runner.temp }}/release
        run: |
          cp checksums.orig checksums.txt
          printf 'x' >> rhythm-soundcheck_linux_amd64.tar.gz
          if "$GITHUB_WORKSPACE/scripts/verify-release.sh" rhythm-soundcheck_linux_amd64.tar.gz; then
            echo "::error::verify-release.sh accepted a changed archive"
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
