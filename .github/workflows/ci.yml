name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
# The shared workflows are pinned by commit so a push to the .github
# repository can't change what runs here; Dependabot bumps the pins.
jobs:
  go:
    uses: RhythmShahriar/.github/.github/workflows/ci-go.yml@4e1c576341190242c956652d00cea38d7918cd40 # master 2026-10-26
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      style: true
  commitlint:
    uses: RhythmShahriar/.github/.github/workflows/commitlint.yml@4e1c576341190242c956652d00cea38d7918cd40 # master 2026-10-26
