name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
# The shared workflows are pinned by commit so a push to the .github
# repository can't change what runs here; Dependabot bumps the pins.
jobs:
  go:
    uses: RhythmShahriar/.github/.github/workflows/ci-go.yml@fb09694450362b6d4b68c631182d78a69b653c83 # master
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      style: true
  commitlint:
    uses: RhythmShahriar/.github/.github/workflows/commitlint.yml@fb09694450362b6d4b68c631182d78a69b653c83 # master
