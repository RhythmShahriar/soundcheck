# Soundcheck as a GitHub Action. See the wiki page Soundcheck-CI for
# examples: https://github.com/RhythmShahriar/rhythm/wiki/Soundcheck-CI
#
# Snapshot main after each deploy, compare every pull request with it
# and comment there:
#
#   on: {push: {branches: [main]}}            # after the deploy job
#     - uses: RhythmShahriar/soundcheck@v1.2.3
#       with: {url: https://example.com, mode: snapshot, baseline: main}
#
#   on: deployment_status                     # a preview is ready
#   permissions: {contents: read, pull-requests: write}
#     - uses: RhythmShahriar/soundcheck@v1.2.3
#       if: github.event.deployment_status.state == 'success'
#       with:
#         url: ${{ github.event.deployment_status.target_url }}
#         mode: compare
#         baseline: main
#         comment: true
#
# Accessibility evidence for the European Accessibility Act on each
# preview: add eaa: true (and statement: true for the draft).
name: Rhythm Soundcheck
description: Did your change break anything? Compare a whole site before and after a deploy, in a real browser.
author: Rhythm Shahriar
branding:
  icon: activity
  color: orange

inputs:
  url:
    description: The site to check, e.g. https://staging.example.com
    required: true
  against:
    description: Compare with this site now (e.g. production), instead of a snapshot.
    required: false
    default: ""
  mode:
    description: >
      What to do: "against" (needs the against input), "snapshot" (record the site, for a later
      compare step in the same job, or with baseline for later runs), "compare" (with the latest
      snapshot, or the baseline), or "run" (check once).
      Default: against when the against input is set, otherwise run.
    required: false
    default: ""
  name:
    description: Snapshot name for mode snapshot.
    required: false
    default: ci
  baseline:
    description: >
      Keep a snapshot between workflow runs, e.g. "main". With mode snapshot (on your main branch,
      after each deploy) it saves .soundcheck/snapshots/<baseline> to the Actions cache; with mode
      compare (on pull requests) it restores the newest one and compares with it. Pull requests can
      restore caches saved on their base branch. Use the same working-directory in both workflows.
      For Vercel or Netlify previews, run the compare on deployment_status with
      url: github.event.deployment_status.target_url, when github.event.deployment_status.state is
      success.
    required: false
    default: ""
  comment:
    description: >
      "true" posts the result as one comment on the pull request and updates that same comment on
      later runs: the counts, the top changes and a link to the full report. The job needs
      "permissions: pull-requests: write"; on deployment_status it finds the open pull request of
      the deployed commit. Other runs without a pull request (a push to main) post nothing. A token
      that can't comment (a pull request from a fork) only gives a warning.
    required: false
    default: "false"
  github-token:
    description: >
      Token for the pull request comment. Default the job's GITHUB_TOKEN. Only a comment this token's
      own user posted is updated. A GitHub App token can't look up its bot's login, so set the
      SOUNDCHECK_COMMENT_AUTHOR environment variable to it (e.g. "my-app[bot]").
    required: false
    default: ${{ github.token }}
  fail-on:
    description: >
      Fail the job on changes at or above broke, new, changed or slower (modes against and compare),
      or on issues at or above error, warning or notice (modes run and snapshot). Default: broke when
      comparing, error otherwise. "none" never fails.
    required: false
    default: ""
  args:
    description: >
      Extra flags, e.g. "--limit 100 --skip speed -k". Split on spaces with no glob expansion, so a value with spaces or
      quotes can't go here: use the headers and config inputs for those.
    required: false
    default: ""
  headers:
    description: >
      Extra request headers, one "Name: value" per line, each passed whole as its own -H, so spaces
      and quotes are kept. For a staging site behind basic auth, "Authorization: Basic" and the
      base64 of user:password, from a secret. Values of four or more characters are masked in the
      log.
    required: false
    default: ""
  config:
    description: >
      Settings file, passed as --config. Relative to working-directory. Default
      .soundcheck/config.yaml there, when it exists.
    required: false
    default: ""
  working-directory:
    description: >
      Folder every step runs in, e.g. apps/web in a monorepo. Soundcheck reads its config and keeps
      its snapshots in .soundcheck/ there.
    required: false
    default: "."
  echo:
    description: >
      Record with Echo the emails, SMS and webhooks each form submit and flow sends and compare
      them with the snapshot's, so a form that says "sent" while no longer sending its email is caught.
      "true" for Echo at http://127.0.0.1:8025, or Echo's URL. Start Echo in an earlier step, e.g.
      with RhythmShahriar/echo@v1 and mode up. Point the site's mail at it. Default off.
    required: false
    default: ""
  eaa:
    description: >
      "true" adds --eaa: accessibility evidence for the European Accessibility Act (the a11y
      and keyboard modules, WCAG 2.1 rules and a statement draft in the run folder). The job
      summary and the comment then carry the accessibility counts and the evidence note. With
      fail-on left at its default a new keyboard trap fails the job; fail-on: new fails on any
      new accessibility problem. Evidence, not a compliance guarantee.
    required: false
    default: "false"
  statement:
    description: >
      "true" also writes the accessibility statement draft accessibility-statement-draft.md in
      working-directory after the run and adds it to the uploaded artifact. It needs a statement:
      block in the settings file (rhythm soundcheck init --eaa writes one); without it the step
      only warns. It replaces a file of that name in the workspace.
    required: false
    default: "false"
  wcag:
    description: >
      Accessibility rules, passed as --wcag: 2.0, 2.1 or 2.2. Default 2.1 for a new snapshot; a
      compare uses its snapshot's.
    required: false
    default: ""
  version:
    description: >
      Soundcheck version to install, e.g. 1.2.3, or latest. Default the release that matches the
      action's tag (RhythmShahriar/soundcheck@v1.2.3 installs 1.2.3), so results only change when
      you move the tag. At a branch or a major tag such as @v1 it installs the latest release and
      warns. Later Soundcheck steps in the same job reuse the install.
    required: false
    default: ""
  upload:
    description: >
      Upload the HTML and JUnit reports (and the statement draft) as a workflow artifact, kept
      for 14 days. Reports contain what your pages showed, screenshots of logged-in pages too.
    required: false
    default: "true"

outputs:
  exit-code:
    description: Soundcheck's exit code (0 ok, 1 --fail-on hit, 2 usage error, 3 couldn't check).
    value: ${{ steps.check.outputs.exit-code }}
  version:
    description: The Soundcheck version that ran, e.g. 1.2.3.
    value: ${{ steps.version.outputs.version }}
  report:
    description: Path of the standalone HTML report.
    value: ${{ steps.check.outputs.report }}
  statement:
    description: Path of the statement draft with statement true, otherwise empty.
    value: ${{ steps.check.outputs.statement }}
  a11y-open:
    description: Open accessibility and keyboard problems of an --eaa run, e.g. 12; empty without it.
    value: ${{ steps.check.outputs.a11y-open }}
  criteria-failed:
    description: WCAG success criteria with failures in an --eaa run, e.g. 3; empty without it.
    value: ${{ steps.check.outputs.criteria-failed }}

runs:
  using: composite
  steps:
    # Every action is pinned by commit, so a moved tag can't change what
    # runs in your job. Dependabot keeps the pins current.
    - name: Pick the Soundcheck version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-install.sh" check'

    - name: Install cosign
      if: steps.version.outputs.skip != 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install Soundcheck
      if: steps.version.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-install.sh" install'

    - name: Check the inputs
      id: prep
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        URL: ${{ inputs.url }}
        AGAINST: ${{ inputs.against }}
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
        BASELINE: ${{ inputs.baseline }}
        EAA: ${{ inputs.eaa }}
        STATEMENT: ${{ inputs.statement }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-run.sh" prepare'

    # The newest cache whose key starts with soundcheck-<baseline>-. The
    # key itself never matches, since this run hasn't saved one.
    - name: Restore the baseline
      if: inputs.baseline != '' && steps.prep.outputs.mode == 'compare'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/${{ steps.prep.outputs.snapshots }}
        key: soundcheck-${{ inputs.baseline }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: soundcheck-${{ inputs.baseline }}-

    - name: Run Soundcheck
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        URL: ${{ inputs.url }}
        AGAINST: ${{ inputs.against }}
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
        FAIL_ON: ${{ inputs.fail-on }}
        ARGS: ${{ inputs.args }}
        HEADERS: ${{ inputs.headers }}
        CONFIG: ${{ inputs.config }}
        ECHO: ${{ inputs.echo }}
        BASELINE: ${{ inputs.baseline }}
        EAA: ${{ inputs.eaa }}
        STATEMENT: ${{ inputs.statement }}
        WCAG: ${{ inputs.wcag }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-run.sh" run'

    # A snapshot with issues (exit 1) is still the baseline; one that
    # couldn't be taken (2 or 3) is not saved.
    - name: Save the baseline
      if: >-
        always() && inputs.baseline != '' && steps.prep.outputs.mode == 'snapshot' &&
        (steps.check.outputs.exit-code == '0' || steps.check.outputs.exit-code == '1')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/${{ steps.prep.outputs.snapshots }}
        key: soundcheck-${{ inputs.baseline }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Upload reports
      id: upload
      if: always() && inputs.upload == 'true' && steps.check.outputs.report != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.prep.outputs.artifact }}
        path: ${{ runner.temp }}/soundcheck-report/
        if-no-files-found: ignore
        # Reports can hold page content and screenshots of logged-in pages.
        retention-days: 14

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && steps.check.outputs.markdown != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MARKDOWN: ${{ steps.check.outputs.markdown }}
        REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: '"$GITHUB_ACTION_PATH/scripts/comment.sh" post "$MARKDOWN" "$REPORT_URL"'

    - name: Fail on changes
      if: steps.check.outputs.exit-code == '1'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        ARTIFACT: ${{ steps.prep.outputs.artifact }}
      run: |
        echo "::error::Soundcheck found changes or issues at or above --fail-on ${FAIL_ON:-its default}. See the job summary and the $ARTIFACT artifact."
        exit 1
