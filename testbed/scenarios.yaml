# Soundcheck testbed scenarios: the benchmark's manifest.
#
# Each scenario breaks one thing on the testbed sites. Switch it with
# ./toggle.sh <id> good|broken (it creates or removes state/<id>).
#
# Fields:
#   site      wp (WordPress, http://localhost:18800) or php (plain PHP, http://localhost:18810)
#   path      the page to start from; the benchmark runs `snapshot <site><path>`
#   include   pages the run is limited to (pages.include globs), so each
#             scenario is checked on its own pages only
#   module    the Soundcheck module that should catch it
#   levels    interaction levels the run needs (--level), when not the default
#   login     the run needs SOUNDCHECK_USER / SOUNDCHECK_PASSWORD (see README)
#   toggle    what the broken state changes and where it's implemented
#   expect    one or more matchers; the scenario is caught when the
#             comparison has a change with that class whose check starts
#             with `check` and whose title contains `title` (case-insensitive)
#   tools     third-party tools in the benchmark that could catch it
#   args      extra rhythm-soundcheck flags for both runs, e.g. [--timeout, 6s]
#   compare_args  extra flags for compare only, e.g. [--fail-on, broke],
#             which snapshot refuses
#   modules   run exactly these modules (--modules), e.g. to add seo or a11y
#   limit     page limit (default 20)
#   timeout   time limit for each command when the bench's -timeout (5m)
#             is too short, e.g. 15m for a 320-page site
#   per_group pages.per_group: pages per URL pattern (-1 for all)
#   echo      the run needs Echo (bench -echo URL); "not run" without it
#   rules     YAML rule files (relative to testbed/) copied into .soundcheck/rules/
#   harness   what the benchmark does besides switching the state; one
#             value or a list:
#               interrupt     sends Ctrl+C (SIGINT) to compare after interrupt_after
#               parallel      runs two compares in the same folder at once
#               delete-shots  deletes the snapshot's screenshots before comparing
#               stress        keeps every CPU busy while compare runs
#               wp-update     runs `rhythm-soundcheck wp-update` with `args`
#                             on the ten testbed-update-* plugins (one 1.1
#                             breaks the contact page) instead of snapshot
#                             and compare; wp/updates/reset.sh puts them
#                             back at 1.0 before and after
#               statement     writes the statement draft after compare
#                             (`statement -o`) and checks it says the
#                             evidence note, "not tested: needs a person"
#                             and the scenario's `says` and never claims
#                             compliance, conformance or a certification
#               requests      fails when Chrome asked any host besides
#                             localhost, 127.0.0.1 or a compose service
#               orders        fails when state/orders.txt (the shop's
#                             orders) or state/sidefx.txt (s88's side
#                             effects) changed during the scenario
#               canaries      writes runtime canaries into state/canaries
#                             for the pages to show and fails when one
#                             turns up in any file the run wrote
#   pending   the detector the expectation needs isn't merged yet: true or
#             the Soundcheck 1.3 build lane it waits for (axe, keyboard,
#             flows, statement, report, cli); the scoreboard counts these
#             separately (see note)
#   forbid    changes that must not be reported (false alarms), same
#             matchers as expect
#   all       every expect entry must hold (default: any one of them)
#   same      the broken state is the good state: nothing is switched
#   backlog   the good state has accessibility findings on purpose, so the
#             good-state audit (TestGoodStateAudit) leaves the page out
#   fixture   a snapshot folder under testbed/ copied in as the snapshot
#             "good" instead of taking one (e.g. one Soundcheck 1.2 wrote)
#   flows     flow files under testbed/ copied into .soundcheck/flows/
#   says      more lines the statement must contain (harness statement)
#   within    the compare must finish within this long
#   control   the scenario's page is checked in every control round too
#
# An expect entry is one of:
#   {class: …, check: …, title: …}   a change (class may be left out: any class);
#                                     source: … also asks the change's source
#                                     (an element's selector) to contain it,
#                                     count: N at least N such changes
#   {warning: "text"}                 a comparison warning containing the text
#   {interrupted: true}               the comparison is marked interrupted
#   {clean: true}                     nothing at or above NEW was reported
#   {exit: N}                         compare exited with N
#   {culprit: slug, compares: N}      wp-update named this plugin, in at most N
#                                     compares (wp-update harness only)
#
# Checks for modules that aren't merged yet are matched by module prefix
# only, e.g. "interact/". The EAA scenarios (args: [--eaa], s49 to s89)
# run with -only eaa; the a11y/ and keyboard/ check names are PRD 8's.

sites:
  wp: http://localhost:18800
  php: http://localhost:18810
  php-https: https://localhost:18811

# The control pass: with every scenario good, snapshot each site and
# compare twice; anything at or above NEW is a false alarm.
control:
  sites: [wp, php]
  limit: 40

scenarios:
  - id: s01
    name: PHP fatal error on one inner page
    site: wp
    path: /s01-fatal/
    include: ["/s01-fatal*"]
    module: health
    toggle: "Pricing Tables 2.0 calls a function it no longer defines (wp/plugins/testbed-pricing)"
    expect:
      - {class: broke, check: health/wp-critical, title: critical error}
    tools: [unlighthouse]

  - id: s02
    name: PHP warning with file and line in the footer of every page
    site: wp
    path: /s02-warning/
    include: ["/s02-warning*"]
    module: health
    toggle: "the theme footer reads a missing setting with display_errors on (wp/themes/testbed/footer.php)"
    expect:
      - {class: new, check: health/php-error, title: "PHP Warning: Undefined array key"}
    tools: [backstop]

  - id: s03
    name: Deprecated notice after a PHP upgrade (plain PHP)
    site: php
    path: /report.php
    include: ["/report.php*"]
    module: health
    toggle: "the legacy strlen(null) line PHP 8.1+ deprecates runs (php/report.php)"
    expect:
      - {class: new, check: health/php-error, title: "PHP Deprecated: strlen()"}
    tools: [backstop]

  - id: s04
    name: White screen (empty 200) on one page
    site: wp
    path: /s04-blank/
    include: ["/s04-blank*"]
    module: health
    toggle: "the page answers 200 with an empty body (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {class: broke, check: health/white-screen, title: white screen}
    tools: [backstop, unlighthouse]

  - id: s05
    name: JS error on load from a plugin script
    site: wp
    path: /s05-js-error/
    include: ["/s05-js-error*"]
    module: health
    toggle: "Store Locator 2.0 throws while starting up (wp/plugins/testbed-widgets/js/locator-2.0.js)"
    expect:
      - {class: new, check: health/js-error, title: "Uncaught TypeError"}
      - {class: broke, check: health/js-error, title: "Uncaught TypeError"}
    tools: [backstop, unlighthouse]

  - id: s06
    name: jQuery deregistered while inline code still uses it
    site: wp
    path: /s06-jquery/
    include: ["/s06-jquery*"]
    module: health
    toggle: "a setting deregisters jquery; the footer's inline jQuery() throws (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {class: new, check: health/js-error, title: "jQuery is not defined"}
    tools: [unlighthouse]

  - id: s07
    name: admin-ajax endpoint returns 500
    site: wp
    path: /s07-ajax/
    include: ["/s07-ajax*"]
    module: health
    toggle: "the stock checker's wp_ajax handler answers 500 (wp/plugins/testbed-widgets)"
    expect:
      - {class: broke, check: health/failed-request, title: "admin-ajax.php returned 500"}
    tools: [unlighthouse]

  - id: s08
    name: REST endpoint used by a widget returns 404
    site: wp
    path: /s08-rest/
    include: ["/s08-rest*"]
    module: health
    toggle: "a plugin update renames the REST route the reviews widget calls (wp/plugins/testbed-widgets)"
    expect:
      - {class: new, check: health/failed-request, title: "/wp-json/testbed/v1/reviews returned 404"}
    tools: [unlighthouse]

  - id: s09
    name: Deleted page that other pages still link to
    site: wp
    path: /s09-links/
    include: ["/s09-links*"]
    module: health
    toggle: "the Spring offer page is gone and answers 404 (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {class: broke, check: health/status, title: "Page not found (404)"}
      - {class: new, check: health/broken-link, title: "spring-offer"}
    tools: [lychee]

  - id: s10
    name: Broken image
    site: wp
    path: /s10-image/
    include: ["/s10-image*"]
    module: health
    toggle: "the content points at a resized image that doesn't exist (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {class: new, check: health/broken-asset, title: "team-1024x683.svg"}
    tools: [lychee, backstop, unlighthouse]

  - id: s11
    name: Contact form stops sending
    site: wp
    path: /s11-form/
    include: ["/s11-form*"]
    module: interact
    levels: [inspect, click, submit]
    toggle: "the form handler fails to send and shows an error (wp/plugins/testbed-forms)"
    expect:
      - {class: broke, check: interact/}
    tools: []

  - id: s12
    name: Menu toggle button becomes dead
    site: wp
    path: /s12-menu/
    include: ["/s12-menu*"]
    module: interact
    levels: [inspect, click]
    toggle: "menu.js 2.0 binds to a class the header doesn't render (wp/themes/testbed/js/menu-2.0.js)"
    expect:
      - {class: broke, check: interact/dead-click, title: does nothing}
      - {class: new, check: interact/dead-click, title: does nothing}
    tools: []

  - id: s13
    name: Button throws a JS error on click
    site: wp
    path: /s13-button/
    include: ["/s13-button*"]
    module: interact
    levels: [inspect, click]
    toggle: "wishlist 2.0 calls an undefined WishlistStore on click (wp/themes/testbed/js/wishlist-2.0.js)"
    expect:
      - {class: broke, check: interact/click-error, title: throws a JS error}
      - {class: new, check: interact/click-error, title: throws a JS error}
    tools: []

  - id: s14
    name: "Layout change: hero disappears, header flips"
    site: wp
    path: /s14-layout/
    include: ["/s14-layout*"]
    module: visual
    toggle: "a body class from the 2.0 layout hides the hero and reverses the header (wp/mu-plugins/testbed-scenarios.php, style.css)"
    expect:
      - {class: changed, check: visual/}
    tools: [backstop]

  - id: s15
    name: Fixed-width element breaks the mobile layout
    site: wp
    path: /s15-mobile/
    include: ["/s15-mobile*"]
    module: visual
    toggle: "the promo strip gets a fixed 1200px width (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {class: changed, check: visual/}
      - {class: new, check: health/not-responsive}
    tools: [backstop, unlighthouse]

  - id: s16
    name: noindex switched on by an SEO setting
    site: wp
    path: /s16-noindex/
    include: ["/s16-noindex*"]
    module: health
    toggle: "blog_public is 0 (\"Discourage search engines\"), so WordPress adds noindex (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {class: new, check: health/noindex, title: noindex}
    tools: [unlighthouse]

  - id: s17
    name: Page title lost
    site: wp
    path: /s17-title/
    include: ["/s17-title*"]
    module: health
    toggle: "the theme's title-tag support is removed, so pages have no <title> (wp/mu-plugins/testbed-scenarios.php)"
    # A title that went away is NEW health/no-title ("Page has no <title>"),
    # which ranks above CHANGED; since v1.2 it isn't also reported as a
    # title changed to nothing (one cause, one line).
    expect:
      - {class: new, check: health/no-title, title: no <title>}
      - {class: changed, check: health/title, title: title changed}
    tools: [unlighthouse]

  - id: s18
    name: Page cache caches the cart
    site: wp
    path: /cart/
    include: ["/cart*", "/shop*"]
    module: cache
    toggle: "the page cache stops bypassing /cart/ (wp/mu-plugins/testbed-cache.php)"
    expect:
      - {class: broke, check: cache/}
      - {class: new, check: cache/}
    tools: []

  - id: s19
    name: "Cache leak: a logged-in page served to visitors"
    site: wp
    path: /s19-account/
    include: ["/s19-account*"]
    module: cache
    login: true
    toggle: "the page cache stores pages rendered for logged-in users, admin bar and name included (wp/mu-plugins/testbed-cache.php)"
    expect:
      - {class: broke, check: cache/}
      - {class: new, check: cache/}
    tools: []

  - id: s20
    name: "Heavy plugin added: 2 MB image and a render-blocking script"
    site: wp
    path: /s20-heavy/
    include: ["/s20-heavy*"]
    module: speed
    toggle: "Heavy Slider adds a 2 MB image and a slow script in <head> (wp/plugins/testbed-heavy)"
    expect:
      - {class: slower, check: speed/}
    tools: [unlighthouse]

  # Site failures from qa.md ("Testbed and benchmark coverage gaps").

  - id: s21
    name: Maintenance mode left on after a failed update
    site: wp
    path: /s21-maintenance/
    include: ["/s21-maintenance*"]
    module: health
    toggle: "every request gets WordPress's 503 \"Briefly unavailable for scheduled maintenance\" screen (wp/mu-plugins/01-testbed-early.php)"
    expect:
      - {class: broke, check: health/status, title: "Server error 503"}
    tools: [lychee, unlighthouse]

  - id: s22
    name: Database connection error
    site: wp
    path: /s22-database/
    include: ["/s22-database*"]
    module: health
    toggle: "every request gets \"Error establishing a database connection\" with a 500 (wp/mu-plugins/01-testbed-early.php)"
    expect:
      - {class: broke, check: health/database}
    tools: [lychee, unlighthouse]

  - id: s23
    name: Fatal error on every page (memory exhausted)
    site: wp
    path: /s23-fatal/
    include: ["/s23-fatal*", "/about*"]
    module: health
    toggle: "every front-end page runs out of memory, so WordPress shows its critical error screen everywhere (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {class: broke, check: health/wp-critical, title: critical error}
    tools: [lychee, unlighthouse]

  - id: s24
    name: Stylesheet 404, the site renders unstyled
    site: wp
    path: /s24-styles/
    include: ["/s24-styles*"]
    module: health
    toggle: "theme 2.0 enqueues style-2.0.css, which wasn't deployed (wp/themes/testbed/functions.php)"
    expect:
      - {class: new, check: health/broken-asset, title: "Broken stylesheet"}
      - {class: changed, check: visual/}
    tools: [lychee, backstop, unlighthouse]

  - id: s25
    name: Mixed content after a move to https
    site: php-https
    path: /mixed.php
    include: ["/mixed.php*"]
    module: health
    args: [-k]
    toggle: "the https page still loads its logo from the old http:// URL (php/mixed.php)"
    expect:
      - {class: new, check: health/mixed-content}
    tools: [unlighthouse]

  - id: s26
    name: robots.txt switched to Disallow /
    site: wp
    path: /s26-robots/
    include: ["/s26-robots*"]
    module: seo
    modules: [health, seo]
    toggle: "a staging robots.txt reaches the site: \"Disallow: /\" (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {class: broke, check: seo/robots-txt}
    tools: []

  - id: s27
    name: Canonical, hreflang, Open Graph and JSON-LD lost
    site: wp
    path: /s27-seo/
    include: ["/s27-seo*"]
    module: seo
    modules: [health, seo]
    toggle: "an SEO plugin update drops the canonical, hreflang, og: tags and the JSON-LD (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {check: seo/canonical}
      - {check: seo/hreflang}
      - {check: seo/og}
      - {check: seo/jsonld}
    tools: [unlighthouse]

  - id: s28
    name: Sitemap answers 500
    site: wp
    path: /s28-sitemap/
    include: ["/s28-sitemap*"]
    module: seo
    modules: [health, seo]
    toggle: "/wp-sitemap.xml and its sub-sitemaps answer 500 (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {check: seo/sitemap}
    tools: []

  - id: s29
    name: A page now redirects to the home page
    site: wp
    path: /s29-redirect/
    include: ["/s29-redirect*"]
    module: health
    toggle: "a redirect plugin's new rule sends the page to / with a 301 (wp/mu-plugins/testbed-scenarios.php)"
    expect:
      - {class: changed, check: health/redirect, title: ends somewhere else}
      - {check: seo/redirect}
    tools: [lychee]

  - id: s30
    name: Stale cached page with an expired nonce
    site: wp
    path: /s30-stale/
    include: ["/s30-stale*"]
    module: cache
    toggle: "the page cache serves a 36-hour-old copy with the old roasting day and an expired form nonce (wp/mu-plugins/testbed-cache.php)"
    # A nonce cached for more than 24 hours is past every WordPress grace
    # period, so the expired nonce is an error: BROKE.
    expect:
      - {class: new, check: cache/stale}
      - {class: new, check: cache/expired-nonce}
      - {class: broke, check: cache/expired-nonce}
    tools: []

  - id: s31
    name: Checkout breaks when placing an order
    site: wp
    path: /checkout/
    include: ["/checkout*"]
    module: interact
    levels: [inspect, click, submit]
    toggle: "the payment step calls a renamed gateway class, so Place order is a fatal error (wp/plugins/testbed-shop)"
    expect:
      - {class: broke, check: interact/}
    tools: []

  - id: s32
    name: A form gains a reCAPTCHA
    site: wp
    path: /s32-captcha/
    include: ["/s32-captcha*"]
    module: interact
    levels: [inspect, click, submit]
    toggle: "a security plugin adds reCAPTCHA markup; without a solved challenge the form refuses (wp/plugins/testbed-forms)"
    expect:
      - {warning: captcha}
    forbid:
      - {class: broke, check: interact/}
    tools: []

  - id: s33
    name: Form says sent while no email goes out
    site: wp
    path: /s33-mail/
    include: ["/s33-mail*"]
    module: echo
    levels: [inspect, click, submit]
    echo: true
    toggle: "an SMTP plugin update fails silently: the form still says sent, no email is sent (wp/plugins/testbed-forms)"
    expect:
      - {class: broke, check: echo/}
      - {class: new, check: echo/no-message}
    tools: []

  - id: s34
    name: Slower server response only (TTFB)
    site: php
    path: /ttfb.php
    include: ["/ttfb.php*"]
    module: speed
    toggle: "a slow database query: the page waits 1.5 s before it answers; size and requests don't change (php/ttfb.php)"
    expect:
      - {class: slower, check: speed/ttfb}
      - {class: slower, check: speed/}
    tools: [unlighthouse]

  - id: s35
    name: A break inside content that loads late
    site: php
    path: /late.php
    include: ["/late.php*"]
    module: health
    toggle: "the section a script loads 1.5 s after the page shows a photo that doesn't exist (php/late.php)"
    expect:
      - {class: new, check: health/broken-asset, title: team-photo-2.svg}
    tools: [backstop, unlighthouse]

  - id: s36
    name: Firewall bot challenge (Cloudflare style)
    site: php
    path: /about.php
    include: ["/about.php*"]
    module: health
    toggle: "the whole site answers 403 with cf-mitigated: challenge and \"Just a moment...\" (php/layout.php)"
    expect:
      - {class: broke, check: health/blocked, title: Cloudflare}
    tools: []

  - id: s37
    name: Staging put behind basic auth (401)
    site: php
    path: /about.php
    include: ["/about.php*"]
    module: health
    toggle: "the whole site answers 401 with WWW-Authenticate: Basic (php/layout.php)"
    expect:
      - {class: broke, check: health/auth-required, title: "Password required (401)"}
    tools: [lychee]

  # Soundcheck's own failure modes (qa.md findings 1 to 5 and more).

  - id: s38
    name: Ctrl+C during compare
    site: php
    path: /archive.php
    include: ["/archive.php*"]
    module: health
    harness: interrupt
    interrupt_after: 5s
    toggle: "each archive page takes 3 s, so the interrupt lands mid-run (php/archive.php)"
    expect:
      - {interrupted: true}
    forbid:
      - {class: broke}
      - {class: new}
    tools: []

  - id: s39
    name: Two compares at once in one folder
    site: php
    path: /
    include: ["/", "/about.php*", "/report.php*"]
    module: health
    harness: parallel
    toggle: "none: the site doesn't change; the benchmark starts two compares in one folder at the same time"
    expect:
      - {clean: true}
    tools: []

  - id: s40
    name: Snapshot with its screenshots missing
    site: php
    path: /banner.php
    include: ["/banner.php*"]
    module: visual
    harness: delete-shots
    toggle: "a large red banner appears; the benchmark deletes the snapshot's shots/ first (php/banner.php)"
    # Soundcheck words the warning by count: "1 screenshot … is", "2
    # screenshots … are".
    expect:
      - {warning: screenshot from the snapshot is missing or unreadable}
      - {warning: screenshots from the snapshot are missing or unreadable}
      - {class: changed, check: visual/}
    tools: [backstop]

  - id: s41
    name: A page that answers just under the timeout
    site: php
    path: /slow.php
    include: ["/slow.php*"]
    module: speed
    args: [--timeout, 6s]
    toggle: "the page waits 5 s before it answers; the run's timeout is 6 s (php/slow.php)"
    expect:
      - {class: slower, check: speed/}
    forbid:
      - {class: broke, check: health/white-screen}
      - {class: new, check: health/no-title}
    tools: []

  - id: s42
    name: Flaky server, one load in five answers 500
    site: php
    path: /flaky.php
    include: ["/flaky.php*"]
    module: health
    toggle: "every fifth request to the payment pages answers 500 (php/flaky.php)"
    expect:
      - {class: unstable}
    tools: []

  - id: s43
    name: Start page redirects to another host
    site: php
    path: /moved.php
    include: ["/moved.php*"]
    module: health
    toggle: "the page answers 302 to the same path on another host name, localhost and 127.0.0.1 swapped (php/moved.php)"
    expect:
      - {exit: 3}
    tools: []

  - id: s44
    name: Busy machine (every CPU loaded)
    site: php
    path: /
    include: ["/", "/about.php*", "/report.php*"]
    module: health
    harness: stress
    toggle: "none: the site doesn't change; the benchmark keeps every CPU busy while compare runs"
    expect:
      - {clean: true}
    tools: []

  - id: s45
    name: A break on page 317 of a 320-page site
    site: php
    path: /catalog.php
    include: ["/catalog.php*"]
    module: health
    limit: 330
    per_group: -1
    # 321 pages take about 4 minutes a run (snapshot, then compare),
    # too close to the bench's 5 minute limit for each command.
    timeout: 15m
    toggle: "item 317 prints a PHP warning (php/catalog.php)"
    expect:
      - {class: new, check: health/php-error, title: "PHP Warning: Undefined array key"}
    tools: [backstop]

  # The YAML rule example from product.md (F8).

  - id: s46
    name: "Elementor widget missing (YAML rule)"
    site: wp
    path: /s46-widgets/
    include: ["/s46-widgets*"]
    module: health
    rules: [rules/elementor-missing-widget.yaml]
    toggle: "an Elementor add-on is deactivated, so its widget shows \"Widget ... not found\" (wp/mu-plugins/testbed-scenarios.php)"
    # The rule says level: error; an error that appears is BROKE.
    expect:
      - {class: broke, check: health/elementor-missing-widget, title: Elementor widget missing}
      - {class: new, check: health/elementor-missing-widget, title: Elementor widget missing}
    tools: []

  - id: s47
    name: "One of ten plugin updates breaks the contact page (wp-update --bisect)"
