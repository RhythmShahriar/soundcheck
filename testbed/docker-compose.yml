# Soundcheck "broken sites" testbed: one WordPress site that hosts the
# WordPress scenarios as separate pages, and a plain-PHP site. Each
# scenario is broken while testbed/state/<id> exists (see toggle.sh), so
# switching never rebuilds or restarts anything.
#
# Everything is thrown away on `make down`: the database lives in tmpfs
# and WordPress in a volume removed with -v, so `make up` always starts
# from the same seeded site.
name: soundcheck-testbed

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress

x-wp-mounts: &wp-mounts
  - wp:/var/www/html
  - ./wp/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  - ./wp/themes/testbed:/var/www/html/wp-content/themes/testbed:ro
  - ./wp/plugins/testbed-pricing:/var/www/html/wp-content/plugins/testbed-pricing:ro
  - ./wp/plugins/testbed-widgets:/var/www/html/wp-content/plugins/testbed-widgets:ro
  - ./wp/plugins/testbed-shop:/var/www/html/wp-content/plugins/testbed-shop:ro
  - ./wp/plugins/testbed-forms:/var/www/html/wp-content/plugins/testbed-forms:ro
  - ./wp/plugins/testbed-heavy:/var/www/html/wp-content/plugins/testbed-heavy:ro
  - ./state:/var/www/html/wp-content/testbed-state:ro

services:
  db:
    image: mariadb:11.4.8
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  wp:
    image: wordpress:6.8.3-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TESTBED_WP_PORT:-18800}:80"
    environment:
      <<: *db-env
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
      # s33: send mail to Echo's SMTP port, e.g. host.docker.internal:1025
      # (see README). Empty: PHP's mail(), which delivers nothing.
      TESTBED_SMTP: ${TESTBED_SMTP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *wp-mounts

  # Seeds the site (pages, posts, menu, users). Run by `make up`:
  # docker compose run --rm cli
  # It is also the WP-CLI that wp-update drives in s47 and s48 (the
  # WordPress image has no WP-CLI):
  # docker compose run --rm --no-deps -T --entrypoint wp cli
  cli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: [tools]
    user: "33:33" # www-data in the apache image, so files stay writable by WordPress
    depends_on:
      - wp
    environment:
      <<: *db-env
      HOME: /tmp
      TESTBED_URL: http://localhost:${TESTBED_WP_PORT:-18800}
    volumes:
      - wp:/var/www/html
      - ./wp/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./wp/themes/testbed:/var/www/html/wp-content/themes/testbed:ro
      - ./wp/plugins/testbed-pricing:/var/www/html/wp-content/plugins/testbed-pricing:ro
      - ./wp/plugins/testbed-widgets:/var/www/html/wp-content/plugins/testbed-widgets:ro
      - ./wp/plugins/testbed-shop:/var/www/html/wp-content/plugins/testbed-shop:ro
      - ./wp/plugins/testbed-forms:/var/www/html/wp-content/plugins/testbed-forms:ro
      - ./wp/plugins/testbed-heavy:/var/www/html/wp-content/plugins/testbed-heavy:ro
      - ./state:/var/www/html/wp-content/testbed-state:ro
      - ./wp/seed.sh:/seed.sh:ro
      # The wp-update plugins' sources and reset.sh (s47, s48). The zips
      # and the installed plugins live in the wp volume, so WP-CLI can
      # update them.
      - ./wp/updates:/testbed-updates:ro
    entrypoint: ["sh", "/seed.sh"]

  # Plain PHP over http and, for s25 (mixed content), https. The
  # certificate is a throwaway self-signed one made at start, so the
  # repository holds no key; Soundcheck needs -k for the https site.
  php:
    image: php:8.3.27-apache
    ports:
      - "127.0.0.1:${TESTBED_PHP_PORT:-18810}:80"
      - "127.0.0.1:${TESTBED_PHP_HTTPS_PORT:-18811}:443"
    environment:
      TESTBED_HTTP_ORIGIN: http://localhost:${TESTBED_PHP_PORT:-18810}
    command:
      - sh
      - -c
      - >-
        openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=localhost
        -keyout /etc/ssl/private/ssl-cert-snakeoil.key -out /etc/ssl/certs/ssl-cert-snakeoil.pem 2>/dev/null
        && a2enmod -q ssl && a2ensite -q default-ssl && exec apache2-foreground
    volumes:
      - ./php:/var/www/html:ro
      - ./state:/var/www/state:ro

volumes:
  wp: {}
