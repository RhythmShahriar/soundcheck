# WordPress's fatal error handler (5.2+) shows this instead of the page.
id: health/wp-critical
match: text
pattern: '(?i)There has been a critical error on (this|your) website'
level: error
title: WordPress "critical error" screen
fix: A plugin or theme threw a fatal error. Check the admin email WordPress sent, or wp-content/debug.log with WP_DEBUG_LOG on.
group: error-screen
priority: 30
