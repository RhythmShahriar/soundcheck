# Every WCAG 2.0, 2.1 and 2.2 success criterion at levels A and AA, with
# its EN 301 549 clause and how Soundcheck tests it. WCAG 2.1 has 50 and
# 2.2 has 55: 2.2 drops 4.1.1 and adds 2.4.11, 2.5.7, 2.5.8, 3.2.6,
# 3.3.7 and 3.3.8.
#
#   id, title       as WCAG numbers and names them
#   slug            the criterion's anchor in the WCAG recommendation and
#                   its test id in WCAG-EM reports (wcag21:<slug>)
#   level           A or AA
#   principle       Perceivable, Operable, Understandable or Robust
#   since           the WCAG version that added it; removed: the one
#                   that dropped it
#   en              the EN 301 549 clause: 9 plus the WCAG number
#   coverage        partly: some of Soundcheck's tests can find failures
#                   of it, never all of them; none: a person must check it
#   tested_by       Soundcheck's own checks that test it. The axe rules
#                   that test it come from axe_rules.gen.go, by the
#                   criteria their tags name, so they aren't listed here
#   note            a fixed result the statement prints instead

