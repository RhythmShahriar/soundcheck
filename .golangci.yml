version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - goheader
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    goheader:
      values:
        regexp:
          YEARS: '20\d\d(-20\d\d)?'
      template: |-
        Copyright (c) {{ YEARS }} Rhythm Shahriar <me@rhy.io>
        SPDX-License-Identifier: MIT
    errcheck:
      exclude-functions: # terminal output; nothing useful to do if stdout is gone
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
      ignore-rules: [authorised] # user-facing copy uses British English
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
formatters:
  enable: [gofmt]
